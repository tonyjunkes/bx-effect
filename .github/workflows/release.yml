name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  publish-forgebox:
    # Disable for now
    if: false
    name: Verify and publish ForgeBox package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: "1.16.0"
          with-commandbox: true

      - name: Install development dependencies
        run: box install

      - name: Run TestBox
        run: >-
          boxlang --bx-config tests/boxlang.json testbox/system/runners/BoxLangRunner.bx
          --directory=tests.specs
          --stream
          --write-report=false
          --properties-summary=false
          --stacktrace=short

      - name: Verify module setting override
        run: >-
          boxlang --bx-config tests/boxlang.executor-override.json testbox/system/runners/BoxLangRunner.bx
          --directory=tests.specs.module
          --stream
          --write-report=false
          --properties-summary=false
          --stacktrace=short

      - name: Validate package descriptor
        run: box package show

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(box package show | jq -r '.version')"
          test "$package_version" = "$RELEASE_TAG"

      - name: Publish to ForgeBox
        env:
          FORGEBOX_API_TOKEN: ${{ secrets.FORGEBOX_API_TOKEN }}
        run: |
          test -n "$FORGEBOX_API_TOKEN"
          box config set nonInteractiveShell=true
          box config set endpoints.forgebox.APIToken="$FORGEBOX_API_TOKEN"
          box publish
