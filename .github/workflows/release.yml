name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Verify BoxLang ${{ matrix.boxlang-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boxlang-version:
          - '1.16.0'
          - latest
          - snapshot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: ${{ matrix.boxlang-version }}
          with-commandbox: true

      - name: Install development dependencies
        run: box install

      - name: Run TestBox
        run: |
          boxlang --bx-home .boxlang/test --bx-config tests/boxlang.json testbox/system/runners/BoxLangRunner.bx \
            --directory=tests.specs --stream --write-report=true --write-json-report=true \
            --reportpath="$RUNNER_TEMP/release-tests" --properties-summary=false --stacktrace=short
          # The runner can exit zero even when specs fail; inspect the actual totals.
          jq -e '.totalFail == 0 and .totalError == 0 and .totalPass > 0' \
            "$RUNNER_TEMP/release-tests/report.json"

      - name: Verify module setting override
        run: |
          boxlang --bx-home .boxlang/test --bx-config tests/boxlang.executor-override.json testbox/system/runners/BoxLangRunner.bx \
            --directory=tests.specs.module --stream --write-report=true --write-json-report=true \
            --reportpath="$RUNNER_TEMP/release-override" --properties-summary=false --stacktrace=short
          jq -e '.totalFail == 0 and .totalError == 0 and .totalPass > 0' \
            "$RUNNER_TEMP/release-override/report.json"

      - name: Inspect package metadata
        run: box package show

      - name: Verify installed consumer
        if: matrix.boxlang-version == 'latest'
        run: |
          package_dir="$RUNNER_TEMP/bx-effect-package"
          consumer_dir="$RUNNER_TEMP/bx-effect-consumer"
          mkdir -p "$package_dir" "$consumer_dir"
          cp -R models "$package_dir/"
          cp box.json ModuleConfig.bx "$package_dir/"
          cp tests/consumer/Smoke.bxm tests/consumer/boxlang.json "$consumer_dir/"
          cd "$consumer_dir"
          box install ID="$package_dir" directory=boxlang_modules production=true save=false
          boxlang --bx-home "$consumer_dir/.boxlang" --bx-config boxlang.json Smoke.bxm

  publish:
    name: Publish tagged release
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate release version
        id: release
        run: |
          VERSION="$(jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+([+-][0-9A-Za-z.-]+)?$"))' box.json)"
          MODULE_VERSION="$(sed -n 's/.*this\.version *= *"\([^"]*\)".*/\1/p' ModuleConfig.bx)"

          if [[ "$VERSION" != "$MODULE_VERSION" ]]; then
            echo "box.json version ($VERSION) does not match ModuleConfig.bx ($MODULE_VERSION)." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "Release tag ($GITHUB_REF_NAME) does not match package version ($VERSION)." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release commit must belong to remote main.' >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require release credentials
        env:
          FORGEBOX_API_TOKEN: ${{ secrets.FORGEBOX_API_TOKEN }}
        run: |
          if [[ -z "$FORGEBOX_API_TOKEN" ]]; then
            echo 'Add a FORGEBOX_API_TOKEN repository secret before releasing.' >&2
            exit 1
          fi

      - name: Set up CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          forgeboxAPIKey: ${{ secrets.FORGEBOX_API_TOKEN }}

      - name: Publish to ForgeBox
        run: box forgebox publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            flags=()
            if [[ "${TAG%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --title "bx-effect $VERSION" --generate-notes "${flags[@]}"
          fi
