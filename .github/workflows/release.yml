name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Verify BoxLang ${{ matrix.boxlang-version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boxlang-version:
          - '1.16.0'
          - latest
          - snapshot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: ${{ matrix.boxlang-version }}
          with-commandbox: true

      - name: Install development dependencies
        run: box install

      - name: Verify release automation
        if: matrix.boxlang-version == 'latest'
        run: bash tests/ci/release-workflow-test.sh

      - name: Run TestBox
        run: |
          boxlang --bx-home .boxlang/test --bx-config tests/boxlang.json testbox/system/runners/BoxLangRunner.bx \
            --directory=tests.specs --stream --write-report=true --write-json-report=true \
            --reportpath="$RUNNER_TEMP/release-tests" --properties-summary=false --stacktrace=short
          # The runner can exit zero even when specs fail; inspect the actual totals.
          jq -e '.totalFail == 0 and .totalError == 0 and .totalPass > 0' \
            "$RUNNER_TEMP/release-tests/report.json"

      - name: Verify module setting override
        run: |
          boxlang --bx-home .boxlang/test --bx-config tests/boxlang.executor-override.json testbox/system/runners/BoxLangRunner.bx \
            --directory=tests.specs.module --stream --write-report=true --write-json-report=true \
            --reportpath="$RUNNER_TEMP/release-override" --properties-summary=false --stacktrace=short
          jq -e '.totalFail == 0 and .totalError == 0 and .totalPass > 0' \
            "$RUNNER_TEMP/release-override/report.json"

      - name: Inspect package metadata
        run: box package show

      - name: Verify installed consumer
        if: matrix.boxlang-version == 'latest'
        run: |
          package_dir="$RUNNER_TEMP/bx-effect-package"
          consumer_dir="$RUNNER_TEMP/bx-effect-consumer"
          mkdir -p "$package_dir" "$consumer_dir"
          cp -R models "$package_dir/"
          cp box.json ModuleConfig.bx "$package_dir/"
          cp tests/consumer/Smoke.bxm tests/consumer/boxlang.json "$consumer_dir/"
          cd "$consumer_dir"
          box install ID="$package_dir" directory=boxlang_modules production=true save=false
          boxlang --bx-home "$consumer_dir/.boxlang" --bx-config boxlang.json Smoke.bxm

  publish:
    name: Tag and publish new version
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and validate release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+([+-][0-9A-Za-z.-]+)?$"))' box.json)"
          MODULE_VERSION="$(sed -n 's/.*this\.version *= *"\([^"]*\)".*/\1/p' ModuleConfig.bx)"

          if [[ "$VERSION" != "$MODULE_VERSION" ]]; then
            echo "box.json version ($VERSION) does not match ModuleConfig.bx ($MODULE_VERSION)." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Releases must run from main.' >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release commit must belong to remote main.' >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            TAG_COMMIT="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              if ! git merge-base --is-ancestor "$TAG_COMMIT" "$GITHUB_SHA"; then
                echo "Existing tag $VERSION is not an ancestor of this main commit." >&2
                exit 1
              fi
              echo "Version $VERSION was already tagged; skipping this main update."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Fail closed on GitHub API errors; only retry an incomplete release
            # when its immutable tag identifies this exact tested commit.
            RELEASES="$(gh release list --limit 1000 --json tagName,isDraft)"
            if jq -e --arg tag "$VERSION" 'any(.[]; .tagName == $tag and .isDraft == false)' <<< "$RELEASES" >/dev/null; then
              echo "Version $VERSION is already released."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Require release credentials
        if: steps.release.outputs.publish == 'true'
        env:
          FORGEBOX_API_TOKEN: ${{ secrets.FORGEBOX_API_TOKEN }}
        run: |
          if [[ -z "$FORGEBOX_API_TOKEN" ]]; then
            echo 'Add a FORGEBOX_API_TOKEN repository secret before releasing.' >&2
            exit 1
          fi

      - name: Set up CommandBox
        if: steps.release.outputs.publish == 'true'
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          forgeboxAPIKey: ${{ secrets.FORGEBOX_API_TOKEN }}

      - name: Tag release commit
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$GITHUB_SHA" ]]
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "$TAG" --message "Release $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish to ForgeBox
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          SLUG="$(jq -er '.slug | select(type == "string" and length > 0)' box.json)"
          box forgebox show slug="$SLUG" --json > "$RUNNER_TEMP/forgebox-entry.json"
          jq -e '.versions | type == "array"' "$RUNNER_TEMP/forgebox-entry.json" >/dev/null
          if jq -e --arg version "$VERSION" 'any(.versions[]; .version == $version)' "$RUNNER_TEMP/forgebox-entry.json" >/dev/null; then
            echo "ForgeBox version $VERSION already exists; continuing without republishing."
          else
            box forgebox publish
          fi

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false
          else
            flags=()
            if [[ "${TAG%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --title "bx-effect $VERSION" --generate-notes "${flags[@]}"
          fi
