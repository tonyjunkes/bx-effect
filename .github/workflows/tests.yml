name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: BoxLang ${{ matrix.boxlang-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boxlang-version:
          - "1.16.0"
          - latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: ${{ matrix.boxlang-version }}
          with-commandbox: true

      - name: Install development dependencies
        run: box install

      - name: Run TestBox
        run: >-
          boxlang --bx-config tests/boxlang.json testbox/system/runners/BoxLangRunner.bx
          --directory=tests.specs
          --stream
          --write-report=false
          --properties-summary=false
          --stacktrace=short

      - name: Verify module setting override
        run: >-
          boxlang --bx-config tests/boxlang.executor-override.json testbox/system/runners/BoxLangRunner.bx
          --directory=tests.specs.module
          --stream
          --write-report=false
          --properties-summary=false
          --stacktrace=short

      - name: Inspect package metadata
        run: box package show

      - name: Verify isolated installed consumer
        shell: bash
        run: |
          consumer_dir="${RUNNER_TEMP}/bx-effect-consumer"
          mkdir -p "${consumer_dir}/boxlang_modules"
          cp tests/consumer/Smoke.bxm tests/consumer/boxlang.json "${consumer_dir}/"
          cd "${consumer_dir}"
          box install "${GITHUB_WORKSPACE}" \
            --directory="boxlang_modules" \
            --production \
            --save=false
          boxlang --bx-config boxlang.json Smoke.bxm
