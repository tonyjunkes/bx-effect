name: PR

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: BoxLang ${{ matrix.boxlang-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boxlang-version:
          - latest
          - snapshot

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: ${{ matrix.boxlang-version }}
          with-commandbox: true

      - name: Install development dependencies
        run: box install

      - name: Run TestBox
        run: |
          boxlang --bx-home .boxlang/test --bx-config tests/boxlang.json testbox/system/runners/BoxLangRunner.bx \
            --directory=tests.specs --stream --write-report=true --write-json-report=true \
            --reportpath="$RUNNER_TEMP/pr-tests" --properties-summary=false --stacktrace=short
          jq -e '.totalFail == 0 and .totalError == 0 and .totalPass > 0' "$RUNNER_TEMP/pr-tests/report.json"

      - name: Verify module setting override
        run: |
          boxlang --bx-home .boxlang/test --bx-config tests/boxlang.executor-override.json testbox/system/runners/BoxLangRunner.bx \
            --directory=tests.specs.module --stream --write-report=true --write-json-report=true \
            --reportpath="$RUNNER_TEMP/pr-override" --properties-summary=false --stacktrace=short
          jq -e '.totalFail == 0 and .totalError == 0 and .totalPass > 0' "$RUNNER_TEMP/pr-override/report.json"
